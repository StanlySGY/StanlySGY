<svg xmlns="http://www.w3.org/2000/svg" width="680" height="8" viewBox="0 0 680 8">
  <defs>
    <!-- 动态循环移动的流光渐变 -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af3" />
      <stop offset="60%" stop-color="#f7768e" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- 赛博外发光霓虹滤镜 -->
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 底色静脉线 -->
  <line x1="0" y1="4" x2="680" y2="4" stroke="#414868" stroke-width="1" opacity="0.4" />
  
  <!-- 霓虹流光主线 -->
  <line x1="0" y1="4" x2="680" y2="4" stroke="url(#laser)" stroke-width="1.5" />
  
  <!-- 外发光霓虹效果副本 -->
  <line x1="0" y1="4" x2="680" y2="4" stroke="url(#laser)" stroke-width="3" filter="url(#neon-glow)" opacity="0.6" />
</svg>
